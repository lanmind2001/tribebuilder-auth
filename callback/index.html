<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TribeBuilder — Redirecting...</title>
    <style>
        body { font-family: -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #1a1a2e; color: #fff; }
        .container { text-align: center; padding: 24px; }
        h1 { font-size: 22px; margin-bottom: 12px; }
        p { color: #aaa; font-size: 14px; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(0,212,170,0.3); border-top-color: #00d4aa; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 20px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="container">
    <div class="spinner"></div>
    <h1>Returning to TribeBuilder...</h1>
    <p>If the app doesn't open automatically, please return to it manually.</p>
</div>
<script>
    // Capture OAuth callback parameters and redirect to custom scheme
    (function() {
        var params = window.location.search || '';
        // Some providers use hash fragments instead of query params
        var hash = window.location.hash || '';

        // Build the custom-scheme redirect URL
        var customScheme = 'tribebuilder://oauth/callback';

        if (params) {
            customScheme += params;
        }
        if (hash) {
            customScheme += (params ? '&' : '?') + hash.substring(1);
        }

        // Redirect to the custom scheme
        window.location.href = customScheme;
    })();
</script>
</body>
</html>
